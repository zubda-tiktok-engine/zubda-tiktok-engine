
name: Zubda TikTok Video Engine

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg and Arabic support
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core
          sudo apt-get install -y libraqm-dev libharfbuzz-dev libfribidi-dev
          sudo apt-get install -y libjpeg-dev zlib1g-dev libfreetype6-dev

      - name: Install Python libraries
        run: |
          pip install --no-binary=Pillow -r requirements.txt

      - name: Check Arabic text support
        run: |
          python -c "from PIL import features; print('RAQM:', features.check_feature('raqm')); assert features.check_feature('raqm')"

      - name: Generate job videos
        run: python renderer.py

      - name: Save processed jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add processed.json
          if ! git diff --cached --quiet; then
            git commit -m "Update processed jobs"
            git push
          fi

      - name: Save TikTok videos
        uses: actions/upload-artifact@v4
        with:
          name: zubda-tiktok-videos
          path: videos/
          if-no-files-found: warn
