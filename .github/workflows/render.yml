
name: Zubda TikTok Video Engine

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Get project
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Generate video scenes
        run: python renderer.py

      - name: Create TikTok MP4
        run: |
          ffmpeg -y \
          -framerate 1/3 \
          -i frames/frame_%03d.png \
          -vf "fps=30,format=yuv420p" \
          -c:v libx264 \
          -movflags +faststart \
          output.mp4

      - name: Save video
        uses: actions/upload-artifact@v4
        with:
          name: zubda-tiktok-video
          path: output.mp4
